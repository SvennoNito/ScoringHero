name: Attach license to Release

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach LICENSE and NOTICE to (empty = all releases)
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # .txt so Windows/macOS users can open them by double-click
    - name: Upload LICENSE and NOTICE to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        cp LICENSE LICENSE.txt
        cp NOTICE NOTICE.txt
        tags="$TAG"
        [ -n "$tags" ] || tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
        for t in $tags; do
          gh release upload "$t" LICENSE.txt NOTICE.txt --clobber
        done
