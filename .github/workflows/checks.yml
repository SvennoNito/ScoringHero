name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libtiff6
      - run: uv run ruff check .
      - run: uv run pytest -v --durations=15
        env:
          QT_QPA_PLATFORM: offscreen
